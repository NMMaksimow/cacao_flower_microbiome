# =============================================================================
# Wemheuer et al. 2020 reanalysis config
# PRJNA594470 — Theobroma cacao leaf endophytes, Cameroon
# Primers present in SRA reads → trim_primers rules will run automatically
# =============================================================================

dataset: "WEMHEUER"

# ── Raw SRA FASTQs (before primer trimming) ───────────────────────────────────
# Snakemake will trim primers from these and build manifests pointing to
# the trimmed files. Set raw_fastq_dir to where the SRR*.fastq.gz files live.
raw_fastq_dir: "data_wemheuer"

# ── Primers ───────────────────────────────────────────────────────────────────
# 16S: S-D-Bact-0341-b-S-17 / S-D-Bact-0785-a-A-21  (Nextera adapters present)
primer_16s_fwd: "CCTACGGGNGGCWGCAG"
primer_16s_rev: "GACTACHVGGGTNTCTAATCC"

# ITS2: ITS3_KYO2 / ITS4  (MiSeq Nextera adapters present)
primer_its1_fwd: "GATGAAGAACGYAGYRAА"   # ITS3_KYO2 (after adapter)
primer_its1_rev: "TCCTCCGCTTATTGATATGC" # ITS4

# Trimmed FASTQ output dir (created by trim_primers rules)
trimmed_dir: "data_wemheuer_trimmed"

# ── Manifests (generated by 02_make_manifest.py after trimming) ───────────────
manifest_16s:  "qiime2_wemheuer/import/manifest_16S.tsv"
manifest_its1: "qiime2_wemheuer/import/manifest_ITS1.tsv"

# ── Same classifiers as CFM (trained on full-length sequences) ────────────────
db_dir: "qiime2/databases"
silva_classifier: "qiime2/databases/SILVA/silva-138-99-nb-diverse-weighted-classifier.qza"
unite_classifier: "qiime2/databases/UNITE/unite_eukaryotes_dynamic_classifier.qza"

# ── Output directories ────────────────────────────────────────────────────────
denoise_dir:  "qiime2_wemheuer/denoise"
taxonomy_dir: "qiime2_wemheuer/taxonomy"
phylo_dir:    "qiime2_wemheuer/phylogeny"
export_dir:   "qiime2_wemheuer/export"
