# =============================================================================
# Pipeline config — one file per dataset
# To reanalyse a different dataset: copy this file, change the values below,
# then run:  snakemake --configfile workflow/config_wemheuer.yaml ...
# =============================================================================

# Short prefix used in all output filenames (e.g. "CFM", "WEMHEUER")
dataset: "CFM"

# ── Input manifests (TSV, PairedEndFastqManifestPhred33V2 format) ─────────────
# Paths must be absolute or relative to the project root.
manifest_16s:  "qiime2/import/manifest_16S.tsv"
manifest_its1: "qiime2/import/manifest_ITS1.tsv"   # set to "" to skip ITS1

# ── Pre-trained classifiers (.qza) ───────────────────────────────────────────
# These are NOT stored in git (too large). Provide on the cluster under db_dir.
db_dir: "qiime2/databases"
silva_classifier:  "qiime2/databases/SILVA/silva-138-99-nb-diverse-weighted-classifier.qza"
unite_classifier:  "qiime2/databases/UNITE/unite_eukaryotes_dynamic_classifier.qza"  # "" to skip

# ── Output directories ────────────────────────────────────────────────────────
denoise_dir:  "qiime2/denoise"
taxonomy_dir: "qiime2/taxonomy"
phylo_dir:    "qiime2/phylogeny"
export_dir:   "qiime2/export"
