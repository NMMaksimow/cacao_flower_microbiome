# =============================================================================
# Pipeline config — Lewis et al. 2023 reanalysis
# Theobroma cacao pod microbiome, Hawaii (PRJNA865318)
# Amplicons: 16S V4 (515F/806R) + ITS1 (ITS1F/ITS2)
# =============================================================================

# Short prefix used in all output filenames
dataset: "CPM_lewis"   # Cocoa Pod Microbiome — Lewis

# ── Input manifests (generated by qiime2_lewis/scripts/02_make_manifest.py) ──
manifest_16s:  "qiime2_lewis/import/manifest_16S.tsv"
manifest_its1: "qiime2_lewis/import/manifest_ITS1.tsv"

# ── Pre-trained classifiers — same databases as CFM ──────────────────────────
db_dir:           "qiime2/databases"
silva_classifier: "qiime2/databases/SILVA/silva-138-99-nb-diverse-weighted-classifier.qza"
unite_classifier: "qiime2/databases/UNITE/unite_eukaryotes_dynamic_classifier.qza"

# ── Primers ───────────────────────────────────────────────────────────────────
# 16S V4: Earth Microbiome Project standard primers (same as CFM)
#   515F: GTGYCAGCMGCCGCGGTAA
#   806R: GGACTACNVGGGTWTCTAAT
#
# ITS1: ITS1F / ITS2 (White et al. 1990)
#   ITS1F: CTTGGTCATTTAGAGGAAGTAA
#   ITS2:  GCTGCGTTCTTCATCGATGC
#
# Cutadapt is applied by the trim_primers_16s / trim_primers_its rules if
# raw_fastq_dir + these keys are set. If manifests already point to
# primer-trimmed files from 02_make_manifest.py, leave raw_fastq_dir empty.

raw_fastq_dir:    "data_lewis/raw_data"
trimmed_16s_dir:  "qiime2_lewis/import/primer_trimmed/16S"
trimmed_its2_dir: "qiime2_lewis/import/primer_trimmed/ITS1"

# LibraryName split pattern (Wemheuer uses Bac/Fun; Lewis uses 16S/ITS)
lib_16s_pattern: "16S"
lib_its_pattern: "ITS"

primer_16s_fwd:  "GTGYCAGCMGCCGCGGTAA"    # 515F
primer_16s_rev:  "GGACTACNVGGGTWTCTAAT"   # 806R

# Snakefile trim rule uses primer_its2_* keys — reuse for ITS1 primers here
primer_its2_fwd: "CTTGGTCATTTAGAGGAAGTAA"  # ITS1F (22 bp)
primer_its2_rev: "GCTGCGTTCTTCATCGATGC"    # ITS2  (20 bp)

# ── DADA2 — 16S V4 (515F/806R, ~253 bp amplicon) ─────────────────────────────
# Starting values — adjust after inspecting demux QC plots:
#   qiime demux summarize → check where Q30 drops on forward / reverse
# With 2×250 reads: forward quality stays high, reverse drops ~150–180 bp.
dada2_trunc_len_f: 230
dada2_trunc_len_r: 160
dada2_max_ee_f: 2.0
dada2_max_ee_r: 2.0

# ── DADA2 — ITS1 (variable length — no fixed truncation) ─────────────────────
# ITS1 amplicons range ~180–380 bp; fixed truncation causes SIGSEGV / low yield.
# Relax maxEE to 5.0 so enough reads survive for error-rate learning.
dada2_trunc_len_f_its: 0
dada2_trunc_len_r_its: 0
dada2_max_ee_f_its: 5.0
dada2_max_ee_r_its: 5.0

# ── ITS OTU clustering ────────────────────────────────────────────────────────
its_otu_perc_identity: 0.97

# ── Output directories ────────────────────────────────────────────────────────
denoise_dir:  "qiime2_lewis/denoise"
taxonomy_dir: "qiime2_lewis/taxonomy"
phylo_dir:    "qiime2_lewis/phylogeny"
export_dir:   "qiime2_lewis/export"
