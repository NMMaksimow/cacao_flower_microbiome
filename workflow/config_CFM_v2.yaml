# =============================================================================
# CFM v2 configuration
# Platform: Illumina NovaSeq 6000, 2x250 bp, binned quality scores
# Amplicons: 16S V4 (515F/806R) + ITS1 (ITS1F/ITS2)
# All paths are relative to the data folder ~/nobackup/cacao_flower_microbiome
# =============================================================================

# ── Input and output folders ──────────────────────────────────────────────────
raw_dir: "data/raw_data/X204SC25042477-Z01-F001/01.RawData"
out_dir: "qiime2_v2"
log_dir: "logs/v2"

# Temporary files of QIIME 2 can be large; keep them on /nobackup, not node /tmp
tmp_dir: "/nobackup/jcnx71/tmp"

# ── Software (environment modules, all under "bioinformatics") ───────────────
module_base:      "bioinformatics"
module_qiime2:    "qiime2/2026.04qiime2"   # cutadapt 5.2, vsearch, R 4.5.2, DADA2 1.38.0
module_cutadapt:  "cutadapt/4.9"           # adapter trimming only, identical to v1
module_stacks:    "stacks/2.64"            # demultiplexing, identical to v1

# QIIME 2's R plugins break with the personal library set in ~/.Renviron, so every
# QIIME 2 and DADA2 command runs with this prefix.
r_isolation: "R_ENVIRON_USER=/dev/null R_PROFILE_USER=/dev/null"

# ── Raw data layout ───────────────────────────────────────────────────────────
# Each lane is a separate sequencing run (own flowcell and instrument):
#   L1 = flowcell HVGYYDRX5 (A01415, run 1088); L2 = flowcell HWYVWDRX5 (A00783, run 1809)
# Raw file name: <sublib>/<sublib>_<library_id>_<flowcell>_<lane>_<read>.fq.gz
library_id: "FKDL250197829-1A"
flowcells:
  L1: "HVGYYDRX5"
  L2: "HWYVWDRX5"

# ── 01. Adapter trimming (identical to v1 step 02) ────────────────────────────
# Nextera adapter read-through at the 3' end of R1 and R2
adapter_r1: "TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG"
adapter_r2: "GTCTCGTGGGCTCGGAGATGTGTATAAGAGACAG"

# ── 03. Primer trimming ───────────────────────────────────────────────────────
# Linked adapters per read: anchored 5' primer (required) ... reverse complement
# of the other primer (optional; removes 3' read-through with all that follows).
# Reverse complements are written out here; cutadapt does not compute them.
markers: ["16S", "ITS1"]
primers:
  16S:                                  # 515F (Parada 2016) / 806R (Apprill 2015)
    fwd:    "GTGYCAGCMGCCGCGGTAA"
    rev:    "GGACTACNVGGGTWTCTAAT"
    fwd_rc: "TTACCGCGGCKGCTGRCAC"
    rev_rc: "ATTAGAWACCCBNGTAGTCC"
  ITS1:                                 # ITS1F / ITS2
    fwd:    "CTTGGTCATTTAGAGGAAGTAA"
    rev:    "GCTGCGTTCTTCATCGATGC"
    fwd_rc: "TTACTTCCTCTAAATGACCAAG"
    rev_rc: "GCATCGATGAAGAACGCAGC"
primer_min_length: 50                   # applied to both mates after trimming
